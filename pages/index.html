<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countries List</title>
  <script src="../scripts/index.js" type="module"></script>
  <link rel="stylesheet" href="../styles/index.css" />
  <link rel="stylesheet" href="https://cdn.lineicons.com/5.0/lineicons.css" />
</head>

<body>
  <div class="navbar-container">
    <nav class="navbar-content">
      <div class="nav-logo">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZUrFzYr0WnOzsxDa4eXl38jjqx7Zk-PQeyA&s" />
      </div>
      <div class="header">
        <h3 class="logo-title">Where, Around the World ?<h3>
            <div class="theme-icon-container">
              <i class="lni lni-moon-half-right-5 moon-icon"></i>
              <p>Dark</p>
            </div>
      </div>
    </nav>
  </div>
   <main>
  <!-- search and filter section -->
   <div class="search-and-filter-container">
    <!-- search container -->
     <div class="search-container">
      <input type="text" id="search-input" placeholder="Enter city name"/>
     </div>
     <!-- filter container -->
      <div class="filter-container">
        <select id="filter-by-region">
          <option hidden>Filter by Region</option>
          <option value=""></option>
        </select>
      </div>
   </div>
   <!-- countries card section -->
    <div class="countries-card-container">
      <div class="country-card">
        <div class="country-image-container">
          <img src="https://flagcdn.com/gs.svg">
        </div>
        <div class="country-text-container">
          <p class="country-name">South Georgia</p>
          <div class="other-texts">
            <div class="capital-texts">
              <p>Capital:</p>
              <p class="text-fade">&nbsp;&nbsp;King Edward Point</p>
            </div>
            <div class="region-text">
              <p>Region:</p>
              <p class="text-fade">&nbsp;&nbsp;Antartica</p>
            </div>
            <div class="population-text">
              <p>Population:</p>
              <p class="text-fade">&nbsp;&nbsp;30</p>
            </div>
          </div>
        </div>
      </div>
      <div class="country-card">2</div>
      <div class="country-card">3</div>
      <div class="country-card">4</div>
      <div class="country-card">5</div>
      <div class="country-card">6</div>
      <div class="country-card">7</div>
      <div class="country-card">8</div>
      <div class="country-card">9</div>
      <div class="country-card">10</div>
      <div class="country-card">11</div>
      <div class="country-card">12</div>
    </div>

   </main>
</body>

</html>
